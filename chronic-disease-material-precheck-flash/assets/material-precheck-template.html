<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申请材料预检与补件清单</title>
  <style>
    :root{--ink:#172535;--muted:#617184;--line:#dce5ed;--bg:#f5f8fb;--paper:#fff;--accent:#176d87;--accent-bg:#e5f4f8;--warn:#875916;--warn-bg:#fff6e5;--good:#27714c;--good-bg:#e9f6ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(1440px,100%);margin:auto;padding:24px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}nav{position:sticky;top:16px;align-self:start;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px}nav strong{display:block;margin-bottom:8px}nav a{display:block;padding:5px 0;color:var(--muted);text-decoration:none}nav a:hover{color:var(--accent)}section{margin-bottom:16px;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:16px}.hero{background:linear-gradient(135deg,#eaf9fb,#fff 65%);border-color:#c9e5eb}h1,h2,h3,h4,p{margin-top:0}h1{font-size:clamp(25px,4vw,36px);line-height:1.25;margin-bottom:6px}h2{font-size:20px}.muted,.reference{color:var(--muted)}.notice{padding:12px 14px;border-radius:10px;background:var(--accent-bg);color:#15536a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{padding:14px;border:1px solid var(--line);border-radius:12px}.label{display:block;margin:9px 0 3px;color:var(--muted);font-size:12px}.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-bg);color:#15536a;font-size:12px}.good{background:var(--good-bg);color:var(--good)}.warn{background:var(--warn-bg);color:var(--warn)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:13px}.list{margin:8px 0 0;padding-left:20px}.list li{margin:5px 0}.source{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:10px}pre{margin:8px 0 0;padding:12px;background:#f7f9fb;border-radius:8px;white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.empty{color:var(--muted);font-style:italic}.error{margin:32px auto;width:min(720px,calc(100% - 32px));padding:18px;border:1px solid #efc1c1;border-radius:12px;background:#fff1f1;color:#8c2424}@media(max-width:800px){.shell{padding:12px;grid-template-columns:1fr}nav{position:static}nav a{display:inline-block;margin-right:10px}section{padding:16px}.table{display:block;overflow:auto}}@media print{body{background:#fff}.shell{display:block;width:100%;padding:0}nav{display:none}section{border:0;border-radius:0;break-inside:avoid}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script id="flash-data" type="application/json">__FLASH_DATA_JSON__</script>
  <script>
    (()=>{"use strict";
      const app=document.getElementById("app"),dataNode=document.getElementById("flash-data");
      const readableText=value=>String(value??"").replace(/\bR(\d+)\b/g,(_,number)=>`规则${number}`).replace(/\bAND\b/g,"且").replace(/\bOR\b/g,"或");
      const node=(tag,text,className)=>{const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined&&text!==null)el.textContent=readableText(text);return el};
      const add=(parent,...children)=>{children.flat().filter(Boolean).forEach(child=>parent.appendChild(child));return parent};
      const section=(id,title)=>{const el=node("section");el.id=id;const heading=node("h2",title);heading.id=`${id}-title`;el.setAttribute("aria-labelledby",heading.id);el.appendChild(heading);return el};
      const list=items=>{if(!items||!items.length)return node("p","无","empty");const ul=node("ul",null,"list");items.forEach(item=>ul.appendChild(node("li",item)));return ul};
      const detail=(label,value)=>add(node("div"),node("span",label,"label"),node("div",value||"未提供"));
      const badge=status=>node("span",status,status==="已定位证据"?"badge good":"badge warn");
      function fail(message){app.replaceChildren(node("div",message,"error"))}
      function validate(data){if(!data||typeof data!=="object")throw new Error("报告数据必须是对象。");if(data.schemaVersion!=="flash-1.0"||data.mode!=="material_precheck")throw new Error("报告数据不是材料预检 Flash 成果。");["meta","standardProfile","sourceDocuments","analysisRecord","precheckItems","supplementList","confirmation"].forEach(key=>{if(!(key in data))throw new Error(`报告数据缺少 ${key}。`)});if(!data.confirmation.standardConfirmed||!data.confirmation.materialsConfirmedComplete)throw new Error("标准采用或材料完整性尚未确认。")}
      function nav(root){const menu=node("nav");add(menu,node("strong","报告目录"));[["overview","报告概览"],["standard","采用标准"],["materials","已确认材料"],["precheck","条件—证据预检"],["supplements","补充信息与补件清单"],["form","材料形式待人工确认"],["logic","标准逻辑"],["analysis","分析记录"],["sources","原始材料"],["confirmation","确认记录"]].forEach(([id,title])=>{const link=node("a",title);link.href=`#${id}`;menu.appendChild(link)});root.appendChild(menu)}
      function overview(data){const el=section("overview","报告概览");el.classList.add("hero");const meta=data.meta;const grid=node("div",null,"grid");add(grid,detail("病种",meta.diseaseName),detail("生成日期",meta.generatedAt),detail("预检项",`${data.precheckItems.length} 项`));add(el,node("h1",meta.reportTitle),node("p","依据已确认标准和已确认材料形成。","muted"),grid,node("p","预检建议，不构成正式资格审核结论。","notice"));return el}
      function standard(data){const el=section("standard","本次采用标准");const s=data.standardProfile;const grid=node("div",null,"grid");add(grid,detail("标准名称",s.name),detail("来源",s.sourceName),detail("版本",s.version),detail("采用方式",s.adoptionMethod));add(el,grid,node("h3","规则摘要"),node("p",s.ruleSummary),node("h3","逻辑摘要"),node("p",s.logicSummary));return el}
      function materials(data){const el=section("materials","已确认材料");const grid=node("div",null,"grid");data.sourceDocuments.filter(source=>source.type==="patient_material").forEach(source=>{const card=node("article",null,"card");add(card,node("h3",source.name),detail("类型","患者材料"));grid.appendChild(card)});add(el,node("p","下列材料已由用户确认完整。","muted"),grid);return el}
      function precheck(data){const el=section("precheck","条件—证据预检");const table=node("table",null,"table"),head=node("thead"),body=node("tbody");const row=node("tr");["条件","状态","已定位证据","说明","优先材料位置"].forEach(title=>row.appendChild(node("th",title)));head.appendChild(row);data.precheckItems.forEach(item=>{const tr=node("tr");const evidence=(item.evidence||[]).join("；")||"—";add(tr,node("td",item.condition),node("td",null),node("td",evidence),node("td",item.detail),node("td",item.preferredSource));tr.children[1].appendChild(badge(item.status));body.appendChild(tr)});add(table,head,body);el.appendChild(table);return el}
      function supplements(data){const el=section("supplements","补充信息与补件清单");if(!data.supplementList.length){el.appendChild(node("p","当前没有需要补充或确认的预检项。","empty"));return el}const grid=node("div",null,"grid");data.supplementList.forEach(item=>{const card=node("article",null,"card");add(card,node("h3",item.title),badge(item.status),detail("优先级",item.priority),detail("原因",item.reason),detail("建议动作",item.action),detail("来源",item.sourceReference));grid.appendChild(card)});el.appendChild(grid);return el}
      function form(data){const el=section("form","材料形式待人工确认");const items=data.precheckItems.filter(item=>item.status==="材料形式待确认");if(!items.length){el.appendChild(node("p","无。","empty"));return el}items.forEach(item=>{const card=node("article",null,"card");add(card,node("h3",item.condition),node("p",item.detail),node("p",`建议：${item.preferredSource}`,"notice"));el.appendChild(card)});return el}
      function logic(data){const el=section("logic","标准逻辑");add(el,node("p",data.standardProfile.logicSummary),node("p","逻辑仅用于解释预检范围，不构成正式资格审核结论。","muted"));return el}
      function analysis(data){const el=section("analysis","分析记录"),a=data.analysisRecord,grid=node("div",null,"grid");[["输入概括",a.inputSummary],["采用的解释",a.interpretations],["证据发现",a.evidenceFindings],["不确定项",a.uncertainties]].forEach(([title,items])=>{const card=node("article",null,"card");add(card,node("h3",title),list(items));grid.appendChild(card)});add(el,grid,node("h3","预检结论"),node("p",a.preliminaryConclusion));return el}
      function sources(data){const el=section("sources","原始材料");data.sourceDocuments.forEach(source=>{const card=node("article",null,"source");add(card,node("h3",source.name),node("p",source.type==="standard"?"标准来源":"患者材料","muted"),node("pre",source.content));el.appendChild(card)});return el}
      function confirmation(data){const el=section("confirmation","确认记录"),c=data.confirmation,grid=node("div",null,"grid");add(grid,detail("标准采用",c.standardConfirmed?"已确认":"未确认"),detail("材料完整性",c.materialsConfirmedComplete?"已确认":"未确认"),detail("标准确认回复",c.standardUserResponse),detail("材料确认回复",c.materialsUserResponse));add(el,grid,node("h3","已展示患者材料"),list(c.inventoryShown));return el}
      try{const data=JSON.parse(dataNode.textContent);validate(data);const shell=node("div",null,"shell");nav(shell);const main=node("main");[overview,standard,materials,precheck,supplements,form,logic,analysis,sources,confirmation].forEach(render=>main.appendChild(render(data)));shell.appendChild(main);app.replaceChildren(shell)}catch(error){fail(`无法生成材料预检报告：${error.message}`)}})();
  </script>
</body>
</html>
